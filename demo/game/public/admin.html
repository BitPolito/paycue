<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Sats Operator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#070910;--panel:#0e1220;--line:#222a44;--ink:#e6e9f5;--muted:#7d86a6;--gold:#f7b529;--rose:#ff5d7a;--teal:#38e0c2;--sans:"Chakra Petch",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding:20px 16px}
main{max-width:1100px;margin:0 auto;display:grid;gap:16px}
h1{font-size:20px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 13px var(--sans);border-radius:8px;border:1px solid var(--line);background:#161c30;color:var(--ink);padding:9px 12px;cursor:pointer}
button.warn{border-color:#6a2a3a;color:var(--rose)}
button.ok{border-color:#1f5b50;color:var(--teal)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font:13px var(--mono)}
dt{color:var(--muted)}
pre{font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:#090c16;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto;margin:0}
input{background:#090c16;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font:13px var(--mono);width:100%}
.msg{font:12px var(--mono);color:var(--gold);min-height:1.2em}
</style>
</head>
<body>
<main>
  <h1>Orbital Sats · operator</h1>
  <p class="msg" id="msg"></p>
  <div class="grid">
    <section>
      <h2>Payouts</h2>
      <div class="btns">
        <button class="warn" data-action="pause">Pause payouts</button>
        <button class="ok" data-action="resume">Resume</button>
      </div>
    </section>
    <section>
      <h2>Studio node (recovery scene)</h2>
      <div class="btns">
        <button class="warn" data-outage="offline">Take offline</button>
        <button class="warn" data-outage="drop-next-response">Drop next response</button>
        <button class="ok" data-outage="normal">Restore</button>
      </div>
    </section>
    <section>
      <h2>Reset between runs</h2>
      <div class="btns">
        <button data-action="reset">Reset (archive database)</button>
        <button class="warn" data-action="reset" data-force="1">Force reset</button>
      </div>
    </section>
  </div>
  <div class="grid">
    <section><h2>Status</h2><dl id="status"></dl></section>
    <section><h2>Open payouts</h2><pre id="open">—</pre></section>
  </div>
  <section>
    <h2>Payout evidence</h2>
    <input id="payoutId" placeholder="payout id (click one under Open payouts or paste from the feed)">
    <pre id="payout" style="margin-top:8px">—</pre>
  </section>
</main>
<script>
const params = new URLSearchParams(location.search);
let token = params.get("token") || "";
try { if (token) sessionStorage.setItem("t", token); else token = sessionStorage.getItem("t") || ""; } catch {}
const $ = (id) => document.getElementById(id);
const api = (path, body) => fetch("/api/admin/" + path, {
  method: body ? "POST" : "GET",
  headers: { "x-admin-token": token, "content-type": "application/json" },
  body: body ? JSON.stringify(body) : undefined,
}).then(async (r) => ({ ok: r.ok, data: await r.json() }));

function render(s) {
  const ch = s.balances?.channels, chain = s.balances?.chain;
  const rows = [
    ["mode", s.mode], ["payouts", s.paused ? "PAUSED" : "running"], ["studio node", s.outage],
    ["budget", `${s.committedSat.toLocaleString()} / ${s.budgetSat.toLocaleString()} sat committed`],
    ["settled", `${s.settledSat.toLocaleString()} sat`], ["per recipient", `${s.perMinuteCount} payouts / min`],
  ];
  if (ch) rows.push(["channel balance", ch.error || `${Number(ch.local_balance?.sat || 0).toLocaleString()} sat out · ${Number(ch.remote_balance?.sat || 0).toLocaleString()} sat in`]);
  if (chain) rows.push(["on-chain", chain.error || `${Number(chain.confirmed_balance || 0).toLocaleString()} sat`]);
  $("status").replaceChildren(...rows.flatMap(([k, v]) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.style.margin = 0; dd.textContent = v; return [dt, dd]; }));
  $("open").textContent = s.openPayouts.length ? s.openPayouts.map((p) => `${p.state.padEnd(10)} ${p.id}  ${p.obligationKey}`).join("\n") : "none";
}
async function refresh() {
  const { ok, data } = await api("status");
  if (!ok) { $("msg").textContent = data.error + " — open this page with ?token=…"; return; }
  render(data);
}
document.querySelectorAll("[data-action]").forEach((b) => b.addEventListener("click", async () => {
  const { ok, data } = await api(b.dataset.action, { force: b.dataset.force === "1" });
  $("msg").textContent = ok ? `${b.textContent}: done` : data.error;
  if (ok) render(data);
}));
document.querySelectorAll("[data-outage]").forEach((b) => b.addEventListener("click", async () => {
  const { ok, data } = await api("outage", { mode: b.dataset.outage });
  $("msg").textContent = ok ? `Studio node: ${b.dataset.outage}` : data.error;
  if (ok) render(data);
}));
$("open").addEventListener("click", (e) => {
  const line = window.getSelection().toString() || "";
  const id = (line.match(/[0-9a-f-]{36}/) || [])[0];
  if (id) { $("payoutId").value = id; showPayout(); }
});
async function showPayout() {
  const id = $("payoutId").value.trim();
  if (!id) return;
  const { data } = await api("payout/" + id);
  $("payout").textContent = JSON.stringify(data, null, 2);
}
$("payoutId").addEventListener("change", showPayout);
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
