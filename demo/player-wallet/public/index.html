<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001CE0">
<title>Player Wallet · BitPolito</title>
<link rel="icon" href="brand/bitpolito-bull-head.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{
  --blue:#001CE0;--white:#FFFFFF;--line:rgba(255,255,255,.22);--soft:rgba(255,255,255,.72);
  --ok:#1A7F3A;--warn:#A55A00;--err:#B3261E;
  --sans:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;--gutter:clamp(16px,3vw,40px);
}
*{box-sizing:border-box}
html{background:var(--blue)}
/* One screen: header, the user row, then the two balances. Only the receipts list scrolls. */
body{margin:0;background:var(--blue);color:var(--white);font:15px/1.5 var(--sans);height:100svh;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}
.label{font:600 11px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase}
.soft{color:var(--soft)}
:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.phone{width:100%;max-width:1040px;margin:0 auto;padding:16px var(--gutter) max(16px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;min-height:0}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.who input{flex:1;min-width:160px}
.who .addr{flex-basis:100%}
.cards{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;min-height:0}
.card{border:2px solid var(--white);border-radius:12px;padding:14px 18px;display:grid;gap:6px;align-content:start;min-height:0}
.card.ln{grid-template-rows:auto auto auto minmax(0,1fr)}
.big{display:flex;align-items:baseline;gap:10px;font:700 clamp(32px,5vw,46px)/1 var(--mono);font-feature-settings:"tnum" 1;margin:4px 0 2px}
.big small{font:600 13px var(--mono);letter-spacing:.12em}
.big img{width:28px;height:28px;align-self:center;image-rendering:pixelated;filter:brightness(0) invert(1)}
.addr{font:12px var(--mono);color:var(--soft);word-break:break-all}
input{width:100%;font:14px var(--mono);color:var(--white);background:transparent;border:2px solid var(--white);border-radius:10px;padding:9px 12px}
input::placeholder{color:rgba(255,255,255,.5)}
ul{list-style:none;margin:4px 0 0;padding:0;overflow:auto;min-height:0;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;font:13px var(--mono);padding:8px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li b{font-weight:700}
li.new{animation:in .9s steps(5) 1}
@keyframes in{0%,50%{background:rgba(255,255,255,.18)}100%{background:transparent}}
.chip{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:9999px;border:1px solid var(--white)}
.chip.ok{background:var(--ok);border-color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{color:var(--soft);font-size:13px;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 6px,transparent 6px 12px);padding:12px;border-radius:8px;margin-top:8px}
.since{font:11px var(--mono);color:var(--soft)}
@media (max-width:760px){
  .cards{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .card{padding:12px 14px}
  .big{font-size:32px}
}
@media (max-height:520px){body{height:auto;overflow:visible}}
@media (prefers-reduced-motion:reduce){li.new{animation:none}}
:root{--nav-ink:#FFFFFF;--nav-bg:#001CE0;--nav-line:rgba(255,255,255,.22);--nav-hover:rgba(255,255,255,.12)}
/* Site header: identical on every demo page, so moving between them nothing jumps. */
.site-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;min-height:80px;padding-block:20px;border-bottom:1px solid var(--nav-line)}
.site-top .brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;min-width:0}
.site-top .brand img{height:36px;width:auto;display:block}
.site-top .brand span{font:600 12px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;padding-left:16px;border-left:1px solid var(--nav-line)}
.site-top .brand b{font-weight:700}
.site-top nav{display:flex;flex-wrap:wrap;gap:8px}
.site-top nav a{display:inline-flex;align-items:center;justify-content:center;font:700 13px/1 var(--sans);border:2px solid currentColor;border-radius:9999px;padding:7px 13px;text-decoration:none;color:inherit;white-space:nowrap;background:transparent}
.site-top nav a:hover{background:var(--nav-hover)}
.site-top nav a[aria-current="page"]{background:var(--nav-ink);color:var(--nav-bg);border-color:var(--nav-ink)}
@media(max-width:720px){.site-top{min-height:0;padding-block:14px}.site-top .brand img{height:28px}.site-top .brand span{display:none}.site-top nav{width:100%}.site-top nav a{flex:1;padding:7px 6px}}
.shell{width:100%;max-width:calc(1560px + 2 * var(--gutter));margin:0 auto;padding-inline:var(--gutter)}
</style>
</head>
<body>
<div class="shell">
  <header class="site-top">
    <a class="brand" data-port="8088" href="#"><img src="brand/bitpolito-logo.svg" alt="BitPolito" width="123" height="36" style="filter:brightness(0) invert(1)"><span><b>Player wallet</b> · signet</span></a>
    <nav aria-label="Demos">
      <a data-port="8088" href="#">Overview</a>
      <a data-port="8090" href="#">Game demo</a>
      <a data-port="8092" href="#">Bounty board</a>
      <a aria-current="page" href="/">Wallet</a>
    </nav>
  </header>
</div>
<main class="phone">
  <label class="who" for="user">
    <span class="label">Lightning Address user</span>
    <input id="user" placeholder="ada" autocomplete="off">
    <span class="addr" id="lnaddr">Enter a user to see their Lightning Address</span>
  </label>

  <div class="cards">
    <section class="card ln" aria-live="polite">
      <div class="row"><span class="label">Lightning received</span><span class="chip" id="lnCount">0 payments</span></div>
      <div class="big"><img src="brand/bitpolito-b.svg" alt=""><span id="sats">0</span><small>SAT</small></div>
      <div class="since" id="since"></div>
      <ul id="receipts"></ul>
    </section>

    <section class="card" aria-live="polite">
      <div class="row"><span class="label">Liquid testnet</span><span class="chip" id="scan">not scanned</span></div>
      <div class="big"><span id="usdt">0.00</span><small>L-USDT</small></div>
      <div class="soft" style="font:13px var(--mono)">L-BTC <span id="lbtc">0</span> sat</div>
      <div class="addr" id="liquidAddr">—</div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
for (const a of document.querySelectorAll("[data-port]")) a.href = location.protocol + "//" + location.hostname + ":" + a.dataset.port + "/";
const params = new URLSearchParams(location.search);
let user = (params.get("user") || "").toLowerCase();
let count = 0;
$("user").value = user;
$("user").addEventListener("change", () => { user = $("user").value.trim().toLowerCase(); history.replaceState(null, "", "?user=" + encodeURIComponent(user)); load(); });

function renderLiquid(l) {
  const usdt = BigInt(l.balances?.["L-USDT"] || "0");
  $("usdt").textContent = (Number(usdt) / 1e8).toFixed(2);
  $("lbtc").textContent = Number(l.balances?.["L-BTC"] || 0).toLocaleString();
  $("liquidAddr").textContent = l.address;
  $("scan").textContent = l.scannedAt ? "scanned " + new Date(l.scannedAt).toLocaleTimeString() : (l.error ? "scan failed" : "scanning…");
}
function item(r, fresh) {
  const li = document.createElement("li");
  if (fresh) li.className = "new";
  li.innerHTML = "<b>+" + r.amountSat.toLocaleString() + " sat</b><span>" + new Date(r.settledAt).toLocaleTimeString() + "</span>";
  return li;
}
function setCount(n) { count = n; $("lnCount").textContent = n + (n === 1 ? " payment" : " payments"); $("lnCount").classList.toggle("ok", n > 0); }
let loaded = false, retryTimer = null;
async function load() {
  let data;
  try {
    const res = await fetch("/api/wallet?user=" + encodeURIComponent(user));
    if (!res.ok) throw new Error(String(res.status));
    data = await res.json();
  } catch {
    // Keep the last balances on screen; say so instead of showing an empty wallet.
    $("lnaddr").textContent = loaded ? "Wallet service unreachable · showing the last balance" : "Wallet service unreachable · retrying";
    if (!loaded) { $("receipts").innerHTML = '<li class="empty">Waiting for the wallet service…</li>'; $("scan").textContent = "offline"; }
    clearTimeout(retryTimer); retryTimer = setTimeout(load, 5000);
    return;
  }
  loaded = true;
  const ln = data.lightning || { receivedSat: 0, recent: [], count: 0 };
  $("sats").textContent = Number(ln.receivedSat || 0).toLocaleString();
  $("lnaddr").textContent = data.lightningAddress || "Enter a user to see their Lightning Address";
  const list = ln.recent || [];
  if (list.length) $("receipts").replaceChildren(...list.map((r) => item(r, false)));
  else $("receipts").innerHTML = '<li class="empty">No payments yet. Shoot a golden coin.</li>';
  setCount(ln.count || 0);
  $("since").textContent = ln.since ? "Counting since " + new Date(ln.since).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  if (data.liquid) renderLiquid(data.liquid);
}
const events = new EventSource("/api/events");
// After a dropped stream, reload so payments made meanwhile aren't missed.
let streamLost = false;
events.onerror = () => { streamLost = true; };
events.onopen = () => { if (streamLost) { streamLost = false; load(); } };
events.addEventListener("lightning", (e) => {
  const r = JSON.parse(e.data);
  if (user && r.user !== user) return;
  $("sats").textContent = (Number($("sats").textContent.replace(/,/g, "")) + r.amountSat).toLocaleString();
  const empty = $("receipts").querySelector(".empty"); if (empty) empty.remove();
  $("receipts").prepend(item(r, true));
  setCount(count + 1);
});
events.addEventListener("liquid", (e) => renderLiquid(JSON.parse(e.data)));
load();
</script>
</body>
</html>
